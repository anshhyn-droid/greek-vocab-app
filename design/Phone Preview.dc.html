<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-006e78d2-136e-4daf-be1e-6321aae247a4/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Hahmlet:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:var(--color-neutral-200)}a{color:var(--color-accent-700)}a:hover{color:var(--color-accent-800)}</style>
</helmet>
<div style="min-height:100vh;padding:32px 28px 48px;box-sizing:border-box;display:flex;flex-direction:column;gap:22px">
  <div style="display:flex;flex-direction:column;gap:4px">
    <span style="font-family:'Hahmlet',serif;font-weight:700;font-size:26px;color:var(--color-text)">폰 화면 미리보기</span>
    <span style="font:600 13px 'Hahmlet',serif;color:var(--color-neutral-700)">390 × 844 (iPhone 14). 위쪽 노치 47px, 아래쪽 홈 막대 34px를 비우고 그 안에 화면을 배치합니다. 각 화면 안에서 직접 풀어볼 수 있습니다.</span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start">
    <sc-for list="{{ screens }}" as="s" hint-placeholder-count="7">
      <div style="display:flex;flex-direction:column;gap:10px">
        <span style="font:800 13px 'Hahmlet',serif;color:var(--color-text)">{{ s.label }}</span>
        <div style="position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--color-bg);box-shadow:0 0 0 10px var(--color-text),0 30px 60px -30px rgba(32,30,29,.5)">
          <iframe src="{{ s.src }}" onLoad="{{ inset }}" style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>
          <div style="position:absolute;left:0;right:0;top:0;height:47px;padding:0 28px 0 36px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;pointer-events:none">
            <span style="font:600 15px var(--font-body);color:var(--color-text)">9:41</span>
            <span style="width:25px;height:12px;padding:1.5px;box-sizing:border-box;border:1.5px solid var(--color-text);border-radius:4px;display:flex">
              <span style="width:80%;border-radius:1.5px;background:var(--color-text)"></span>
            </span>
          </div>
          <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:160px;height:32px;border-radius:0 0 20px 20px;background:var(--color-text);pointer-events:none"></div>
          <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:999px;background:var(--color-text);pointer-events:none"></div>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // 화면 안 페이지에 안전 영역 값을 넣음 (실제 폰에서는 브라우저가 env(safe-area-inset-*)로 줌)
  inset = e => { try { const s = e.target.contentDocument.documentElement.style; s.setProperty("--sat", "47px"); s.setProperty("--sab", "34px"); } catch (err) {} };
  renderVals() {
    return {
      inset: this.inset,
      screens: [
        { label: "학습 (홈)", src: "Start.dc.html" },
        { label: "과 메뉴", src: "Lesson Menu.dc.html" },
        { label: "테스트", src: "Review.dc.html" },
        { label: "마이페이지", src: "Start.dc.html#me" },
        { label: "단어 학습", src: "Word Study.dc.html" },
        { label: "문법 학습", src: "Grammar Study.dc.html" },
        { label: "문장 학습", src: "Sentence Study.dc.html" }
      ]
    };
  }
}
</script>
</body>
</html>
